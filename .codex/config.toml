# Project-only Blender MCP. Existing user MCP servers are inherited unchanged.
[mcp_servers.blender]
command = "/home/daydert/.local/share/codex-cinematics/runtime/bin/python"
args = ["/home/daydert/MinecraftSurvivors2/scripts/cinematics/blender_mcp_local.py"]
cwd = "/home/daydert/MinecraftSurvivors2"
enabled = true
startup_timeout_sec = 30
tool_timeout_sec = 60
